<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RubyChan AI - Owner Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0b0514; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card { background: rgba(24, 11, 40, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(225, 29, 72, 0.2); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    <header class="glass-card rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4 shadow-xl border-rose-900/40">
      <div class="flex items-center space-x-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 to-purple-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-rose-600/30">👑</div>
        <div>
          <h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-rose-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">RubyChan AI Owner Portal</h1>
          <p class="text-xs text-slate-400">Master Administration & Real-Time Telemetry</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/50 text-emerald-400 text-xs font-bold flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online & Active</span>
        <a href="/?admin=true" class="px-4 py-2 bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white text-xs font-black rounded-xl shadow-lg shadow-rose-600/20 transition-all flex items-center gap-2"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open React MiniApp</a>
      </div>
    </header>

    <div class="flex flex-wrap gap-2 border-b border-rose-900/30 pb-3">
      <button onclick="switchTab('stats')" id="tab-stats" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white shadow-lg shadow-rose-600/20"><i class="fa-solid fa-chart-pie mr-1.5"></i> Platform Stats</button>
      <button onclick="switchTab('users')" id="tab-users" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-users mr-1.5"></i> Users & Telegram Members</button>
      <button onclick="switchTab('characters')" id="tab-characters" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-robot mr-1.5"></i> AI Characters</button>
      <button onclick="switchTab('broadcast')" id="tab-broadcast" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-bullhorn mr-1.5"></i> Broadcast Push</button>
      <button onclick="switchTab('config')" id="tab-config" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-sliders mr-1.5"></i> System Config</button>
    </div>

    <div id="content-container">
      <div id="loading" class="text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl text-rose-500 mb-2"></i><p class="text-xs">Loading Owner Data...</p></div>
      <div id="view-stats" class="hidden space-y-6"></div>
      <div id="view-users" class="hidden space-y-4"></div>
      <div id="view-characters" class="hidden space-y-4"></div>
      <div id="view-broadcast" class="hidden space-y-4"></div>
      <div id="view-config" class="hidden space-y-4"></div>
    </div>
  </div>

<script>
const ADMIN_KEY='rubychan_admin_2026';
const API_BASE='https://rmmanieytszkfzdyrjvt.supabase.co/functions/v1/rubychan-owner-api-v3';
let currentTab='stats';

async function fetchApi(endpoint, options={}){
  const path=endpoint.startsWith('/api/')?endpoint.slice(4):endpoint;
  const url=`${API_BASE}${path}`;
  options.headers={'Content-Type':'application/json','x-admin-key':ADMIN_KEY,...(options.headers||{})};
  const res=await fetch(url,options);
  const text=await res.text();
  let data={};
  try{data=text?JSON.parse(text):{};}catch{throw new Error(`Server returned ${res.status} instead of JSON`);}
  if(!res.ok) throw new Error(data.error||data.message||`Request failed (${res.status})`);
  return data;
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.className='tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-slate-300 hover:bg-slate-800');
  document.getElementById('tab-'+tab).className='tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white shadow-lg shadow-rose-600/20';
  ['stats','users','characters','broadcast','config'].forEach(t=>document.getElementById('view-'+t).classList.add('hidden'));
  document.getElementById('view-'+tab).classList.remove('hidden');
  loadCurrentTab();
}

async function loadCurrentTab(){
  document.getElementById('loading').classList.remove('hidden');
  try{
    if(currentTab==='stats')await loadStats();
    if(currentTab==='users')await loadUsers();
    if(currentTab==='characters')await loadCharacters();
    if(currentTab==='broadcast')renderBroadcast();
    if(currentTab==='config')await loadConfig();
  }catch(err){console.error(err);alert(err.message||'Unable to load Owner data.');}
  finally{document.getElementById('loading').classList.add('hidden');}
}

async function loadStats(){
  const data=await fetchApi('/api/admin/stats'); const stats=data.stats||{}; const el=document.getElementById('view-stats');
  el.innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="glass-card p-5 rounded-2xl border-rose-900/30"><p class="text-xs text-slate-400 font-bold mb-1">Total Users</p><p class="text-2xl font-black text-white">${stats.totalUsers||0}</p><span class="text-[10px] text-emerald-400 font-bold">Active Members</span></div>
    <div class="glass-card p-5 rounded-2xl border-amber-900/30"><p class="text-xs text-slate-400 font-bold mb-1">VIP Members</p><p class="text-2xl font-black text-amber-400">👑 ${stats.totalVipUsers||0}</p><span class="text-[10px] text-amber-400 font-bold">Premium Subscribers</span></div>
    <div class="glass-card p-5 rounded-2xl border-purple-900/30"><p class="text-xs text-slate-400 font-bold mb-1">Total AI Messages</p><p class="text-2xl font-black text-purple-300">💬 ${stats.totalMessages||0}</p><span class="text-[10px] text-purple-400 font-bold">Conversations</span></div>
    <div class="glass-card p-5 rounded-2xl border-pink-900/30"><p class="text-xs text-slate-400 font-bold mb-1">Characters</p><p class="text-2xl font-black text-rose-300">🎭 ${stats.totalCharacters||0}</p><span class="text-[10px] text-pink-400 font-bold">Platform Directory</span></div>
  </div>`;
}

async function loadUsers(){
  const data=await fetchApi('/api/admin/users?limit=100'); const users=data.users||[]; const el=document.getElementById('view-users');
  const rowsHtml=users.map(u=>{const fullName=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'User';const tgId=u.telegram_id||(String(u.id||'').startsWith('tg_')?String(u.id).replace('tg_',''):'');const plan=u.premium_plan||u.plan||'free';return `<tr class="border-b border-rose-900/20 hover:bg-rose-950/20 text-xs"><td class="p-3"><p class="font-extrabold text-white">${fullName}</p><div class="flex items-center gap-1.5 mt-0.5">${tgId?`<span class="text-[10px] font-mono text-emerald-400 bg-emerald-950/60 px-1.5 py-0.5 rounded border border-emerald-800/40">🆔 ${tgId}</span>`:`<span class="text-[10px] font-mono text-slate-400">${u.id||''}</span>`}${u.username?`<span class="text-[10px] text-rose-300">${u.username}</span>`:''}</div></td><td class="p-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-black ${plan!=='free'?'bg-amber-950 text-amber-300 border border-amber-500/50':'bg-slate-900 text-slate-400 border border-slate-700'}">${String(plan).toUpperCase()}</span></td><td class="p-3 text-amber-300 font-bold">⚡ ${u.energy??50}</td><td class="p-3 text-rose-300 font-bold">💎 ${u.gems??0}</td><td class="p-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${u.status==='banned'?'bg-red-950 text-red-300 border-red-800':'bg-emerald-950 text-emerald-300 border-emerald-800'}">${u.status||'active'}</span></td></tr>`}).join('');
  el.innerHTML=`<div class="glass-card rounded-2xl overflow-hidden shadow-xl border-rose-900/40"><div class="p-4 bg-[#180b28] border-b border-rose-900/30 flex justify-between items-center"><h3 class="font-extrabold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-users text-rose-400"></i> Registered Members & Telegram Users</h3><button onclick="loadUsers()" class="px-3 py-1.5 bg-rose-950 hover:bg-rose-900 text-rose-200 border border-rose-700 text-xs rounded-xl font-bold"><i class="fa-solid fa-arrows-rotate mr-1"></i> Refresh</button></div><div class="overflow-x-auto"><table class="w-full text-left"><thead class="bg-[#12071f] text-slate-400 uppercase text-[10px] font-extrabold border-b border-rose-900/30"><tr><th class="p-3">Member & Telegram ID</th><th class="p-3">Plan</th><th class="p-3">Energy</th><th class="p-3">Gems</th><th class="p-3">Status</th></tr></thead><tbody>${users.length===0?'<tr><td colspan="5" class="p-6 text-center text-slate-500 text-xs">No member records found.</td></tr>':rowsHtml}</tbody></table></div></div>`;
}

async function loadCharacters(){
  const data=await fetchApi('/api/characters'); const chars=data.characters||[]; const el=document.getElementById('view-characters');
  const cardsHtml=chars.map(c=>{const avatar=c.avatar||c.image_url||'';return `<div class="glass-card p-4 rounded-2xl border-rose-900/30 flex items-start space-x-3.5"><img src="${avatar}" class="w-14 h-14 rounded-2xl object-cover border border-rose-500/40 shrink-0" onerror="this.style.display='none'"/><div class="flex-1 min-w-0"><div class="flex items-center gap-1.5"><h4 class="font-extrabold text-sm text-white truncate">${c.name||'Character'}</h4>${c.is_premium?'<span class="text-[9px] bg-rose-950 text-rose-300 px-1.5 py-0.2 rounded border border-rose-600/40 font-bold">18+ VIP</span>':''}</div><p class="text-[11px] text-rose-300 line-clamp-1 mb-1">${c.title||''}</p><p class="text-[10px] text-slate-400 line-clamp-2">${c.personality||''}</p></div></div>`}).join('');
  el.innerHTML=`<div class="flex justify-between items-center"><h3 class="font-extrabold text-sm text-white">AI Characters Platform Directory (${chars.length})</h3><a href="/?admin=true" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white text-xs rounded-xl font-bold"><i class="fa-solid fa-plus mr-1"></i> Edit in React App</a></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${cardsHtml}</div>`;
}

function renderBroadcast(){
  document.getElementById('view-broadcast').innerHTML=`<div class="glass-card p-6 rounded-2xl border-rose-900/40 space-y-4 max-w-2xl"><h3 class="font-extrabold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-bullhorn text-rose-400"></i> Send Telegram Push Broadcast</h3><p class="text-xs text-slate-400">Send an instant broadcast alert with optional MiniApp launch button to all active Telegram users.</p><div><label class="text-xs font-bold text-slate-300 block mb-1">Message Content</label><textarea id="bc-msg" rows="4" class="w-full bg-[#140a1f] border border-rose-900/40 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500" placeholder="Type your broadcast message here..."></textarea></div><div><label class="text-xs font-bold text-slate-300 block mb-1">Optional WebApp Button URL</label><input id="bc-url" type="text" class="w-full bg-[#140a1f] border border-rose-900/40 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500" placeholder="https://..." /></div><button onclick="sendBroadcast()" id="bc-btn" class="px-5 py-2.5 bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white text-xs font-black rounded-xl shadow-lg shadow-rose-600/30"><i class="fa-solid fa-paper-plane mr-1.5"></i> Send Broadcast</button></div>`;
}

async function sendBroadcast(){
  const msg=document.getElementById('bc-msg').value.trim(); const url=document.getElementById('bc-url').value.trim(); if(!msg)return alert('Please enter broadcast message text.');
  const btn=document.getElementById('bc-btn'); btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-1"></i> Sending...';
  try{const res=await fetchApi('/api/admin/broadcast',{method:'POST',body:JSON.stringify({message:msg,webAppUrl:url||undefined})});alert(res.message||'Broadcast complete!');document.getElementById('bc-msg').value='';}catch(e){alert('Broadcast failed: '+e.message);}finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-paper-plane mr-1.5"></i> Send Broadcast';}
}

async function loadConfig(){
  const data=await fetchApi('/api/admin/system-config'); const cfg=data.config||{}; const el=document.getElementById('view-config');
  el.innerHTML=`<div class="glass-card p-6 rounded-2xl border-rose-900/40 space-y-4 max-w-2xl"><h3 class="font-extrabold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-sliders text-rose-400"></i> AI & Telegram Configuration</h3><div class="grid grid-cols-2 gap-4 text-xs"><div class="p-3 bg-[#12071f] rounded-xl border border-rose-900/30"><p class="text-slate-400 font-bold mb-1">Telegram Bot</p><p class="text-rose-300 font-mono font-bold">${cfg.botUsername||'@Rubby_Chan_Bot'}</p></div><div class="p-3 bg-[#12071f] rounded-xl border border-rose-900/30"><p class="text-slate-400 font-bold mb-1">Default AI Engine</p><p class="text-emerald-400 font-mono font-bold">${cfg.defaultModel||'gemini-3.7-flash'}</p></div></div><div class="pt-2"><button onclick="downloadBackup()" class="px-4 py-2 bg-purple-950 hover:bg-purple-900 text-purple-200 border border-purple-700/60 rounded-xl text-xs font-bold inline-flex items-center gap-2"><i class="fa-solid fa-download"></i> Download Full Database Backup JSON</button></div></div>`;
}

async function downloadBackup(){
  try{const data=await fetchApi('/api/admin/export-data');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`rubychan-owner-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);}catch(e){alert('Backup failed: '+e.message);}
}

loadCurrentTab();
</script>
</body>
</html>
